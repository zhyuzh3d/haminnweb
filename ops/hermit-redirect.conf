# Legacy host for the pre-rename domain, published from the HaminnWeb repository.
#
# The product and its official site moved to haminn.airen.life. This vhost keeps
# the old name alive for bookmarks, already-installed APKs and any published
# link: every request is redirected to the matching path on the new host.
#
# The reservation paths that older APKs call directly (/__hermit/ reserved
# assets and the /_repo/github/ read-only gateway) are served by the new host,
# so the redirect stays correct for them as well. The ACME HTTP-01 path is kept
# servable here so `certbot renew` keeps working for this certificate.
server {
    server_name hermit.airen.life;

    location / {
        return 301 https://haminn.airen.life$request_uri;
    }

    # Xray owns public TCP/443; it forwards ordinary HTTPS to this local TLS listener.
    listen 127.0.0.1:9443 ssl;
    ssl_certificate /etc/letsencrypt/live/hermit.airen.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hermit.airen.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name hermit.airen.life;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://haminn.airen.life$request_uri;
    }
}
