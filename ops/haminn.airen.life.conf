server {
    server_name haminn.airen.life;
    root /var/www/haminn;
    index index.html;

    # Keep the Haminn-reserved public URL stable while storing its browser
    # fallback assets in the site's unified assets directory.
    location ^~ /__haminn/icons/fontawesome/ {
        alias /var/www/haminn/assets/vendor/fontawesome/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Legacy reserved prefix. APKs released before the rename still request
    # /__hermit/icons/... and reach this host through the 301 on the old
    # domain, so both prefixes must resolve to the same real assets.
    location ^~ /__hermit/icons/fontawesome/ {
        alias /var/www/haminn/assets/vendor/fontawesome/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /shell/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Read-only GitHub gateway for Android devices on networks where GitHub's
    # API, raw files or codeload host cannot be reached directly. Each prefix
    # is pinned to one upstream, so this cannot be used as an arbitrary proxy.
    location ^~ /_repo/github/api/ {
        limit_except GET HEAD { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "HaminnApp-Repository-Installer";
        proxy_hide_header Set-Cookie;
        proxy_pass https://api.github.com/;
    }

    location ^~ /_repo/github/raw/ {
        limit_except GET HEAD { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header User-Agent "HaminnApp-Repository-Installer";
        proxy_hide_header Set-Cookie;
        proxy_pass https://raw.githubusercontent.com/;
    }

    location ^~ /_repo/github/archive/ {
        limit_except GET HEAD { deny all; }
        proxy_ssl_server_name on;
        proxy_set_header Host codeload.github.com;
        proxy_set_header User-Agent "HaminnApp-Repository-Installer";
        proxy_hide_header Set-Cookie;
        proxy_pass https://codeload.github.com/;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Xray owns public TCP/443; it forwards ordinary HTTPS to this local TLS listener.
    listen 127.0.0.1:9443 ssl;
    ssl_certificate /etc/letsencrypt/live/haminn.airen.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/haminn.airen.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = haminn.airen.life) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name haminn.airen.life;
    return 404; # managed by Certbot
}
