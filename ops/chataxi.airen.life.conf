# chataxi product site, published from the HaminnWeb repository.
#
# The site root is public/chataxi/. The shared Haminn brand assets stay in
# public/assets/ and are reached through the alias below, so the header,
# stylesheet and script are byte-identical on haminn.airen.life,
# chataxi.airen.life and hamdraw.airen.life.
server {
    server_name chataxi.airen.life;
    root /var/www/haminn/chataxi;
    index index.html;

    location ^~ /assets/ {
        alias /var/www/haminn/assets/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Xray owns public TCP/443 and forwards ordinary HTTPS to this local TLS
    # listener; nginx selects the virtual host by SNI.
    listen 127.0.0.1:9443 ssl;
    ssl_certificate /etc/letsencrypt/live/chataxi.airen.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chataxi.airen.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name chataxi.airen.life;

    # Keep the ACME HTTP-01 path servable instead of redirecting it away, so
    # `certbot renew` keeps working with the webroot authenticator.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
