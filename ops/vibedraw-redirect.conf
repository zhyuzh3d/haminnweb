# Legacy product site for the pre-rename happ, published from the HaminnWeb repository.
#
# The product is now HamDraw and its site moved to hamdraw.airen.life. This vhost
# keeps the old name alive for bookmarks and published links by redirecting every
# request to the matching path on the new host. The ACME HTTP-01 path stays
# servable so `certbot renew` keeps working for this certificate.
server {
    server_name vibedraw.airen.life;

    location / {
        return 301 https://hamdraw.airen.life$request_uri;
    }

    # Xray owns public TCP/443; it forwards ordinary HTTPS to this local TLS listener.
    listen 127.0.0.1:9443 ssl;
    ssl_certificate /etc/letsencrypt/live/vibedraw.airen.life/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vibedraw.airen.life/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name vibedraw.airen.life;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://hamdraw.airen.life$request_uri;
    }
}
